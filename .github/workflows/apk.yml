name: Build & Release APK

# Push par: Creator Studio web app build → APK assets me zip → Gradle release APK
# → GitHub Release publish (updater isi se naya version dhoondta hai).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version.json
        id: ver
        run: |
          VC=$(python3 -c "import json;print(json.load(open('version.json'))['version_code'])")
          VN=$(python3 -c "import json;print(json.load(open('version.json'))['version_name'])")
          echo "version_code=$VC" >> $GITHUB_OUTPUT
          echo "version_name=$VN" >> $GITHUB_OUTPUT
          echo "Version: $VN ($VC)"

      # ── 1) Creator Studio web app ────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: creator-studio/package-lock.json

      - name: Build Creator Studio web app
        working-directory: creator-studio
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # static assets standalone ke .next/ me (Next docs pattern); public/data zip step me
          cp -r .next/static .next/standalone/.next/

      - name: Zip Studio into APK assets
        run: |
          mkdir -p app/src/main/assets
          rm -f app/src/main/assets/creator-studio.zip
          cd creator-studio
          # public + seed data ko standalone ke ANDAR daalo (Next docs pattern)
          rm -rf .next/standalone/public
          [ -d public ] && cp -r public .next/standalone/public || mkdir -p .next/standalone/public
          rm -rf .next/standalone/data
          cp -r data .next/standalone/data
          # IMPORTANT (v1.0.0 regression fix): zip me standalone ke CONTENTS root par hone
          # chahiye — server.js zip root par, koi .next/standalone/ wrapper nahi.
          # StudioServerManager $HOME/creator-studio/ me extract karke root server.js dhoondta hai.
          cd .next/standalone
          zip -qr ../../../app/src/main/assets/creator-studio.zip .
          cd ../../..
          if ! unzip -l app/src/main/assets/creator-studio.zip | grep -q " server.js$"; then
            echo "::error::creator-studio.zip ke ROOT par server.js nahi hai — zip layout galat"
            unzip -l app/src/main/assets/creator-studio.zip | head -20
            exit 1
          fi
          if unzip -l app/src/main/assets/creator-studio.zip | grep -q "\.next/standalone/server.js"; then
            echo "::error::zip me .next/standalone wrapper hai — contents root par zip karo"
            exit 1
          fi
          echo "sanity ok: server.js zip root par hai"
          ls -lh app/src/main/assets/creator-studio.zip

      # ── 2) Android build ─────────────────────────────────────────────────
      - name: Setup Go (agy_ide_bridge build)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK runner par preinstalled hai (/usr/local/lib/android/sdk) —
      # missing platforms/build-tools Gradle khud download kar leta hai.

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret missing — repo Settings → Secrets me set karo"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Gradle release builds (standard + termux)
        env:
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          # keystore credentials build.gradle.kts me hardcoded defaults se aate hain;
          # CI secrets alag hon to override script se karo — simple case: wahi defaults
          ./gradlew :app:assembleStandardRelease :app:assembleTermuxRelease --stacktrace -x lint

      # ── 3) Release publish ───────────────────────────────────────────────
      - name: Collect APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk -name "*-release.apk" -exec cp {} apks/ \;
          cd apks
          VN="${{ steps.ver.outputs.version_name }}"
          for f in *.apk; do
            case "$f" in
              *standard*) mv "$f" "CreatorStudio-standard-v$VN-release.apk";;
              *termuxShared*) mv "$f" "CreatorStudio-termux-shared-v$VN-release.apk";;
              *termux*) mv "$f" "CreatorStudio-termux-v$VN-release.apk";;
            esac
          done
          ls -lh

      - name: Detect release (version bump ya pehli release pending)
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VN="${{ steps.ver.outputs.version_name }}"
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q '^version.json$'; then
            echo "version.json badla — release publish hogi"
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif ! gh release view "v$VN" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VN release abhi tak nahi bani — pehli green build par publish karenge"
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "release v$VN already live — skip"
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.detect.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VN="${{ steps.ver.outputs.version_name }}"
          TAG="v$VN"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — assets replace nahi karte, skip"
            exit 0
          fi
          python3 -c "
          import json
          changelog = json.load(open('version.json')).get('changelog', [])
          print('\n'.join(f'- {c}' for c in changelog))
          " > /tmp/notes.md
          # MCP plugin zip bhi release me attach — phone par sidhe download karke
          # Settings → Skills & Plugins me install karna hai (manifest.json zip root par)
          zip -j CreatorStudio-MCP-plugin.zip \
            creator-studio-plugin/manifest.json \
            creator-studio-plugin/worker.js \
            creator-studio-plugin/README.md
          gh release create "$TAG" apks/*.apk CreatorStudio-MCP-plugin.zip --repo "$GITHUB_REPOSITORY" \
            --title "Creator Studio v$VN" --notes-file /tmp/notes.md
